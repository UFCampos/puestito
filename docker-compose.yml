services:
  postgres:
    image: postgres:16-alpine
    container_name: tupuestito_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tupuestito
      POSTGRES_PASSWORD: tupuestito_dev_password
      POSTGRES_DB: tupuestito
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

